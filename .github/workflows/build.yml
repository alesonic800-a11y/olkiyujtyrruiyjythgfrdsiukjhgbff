name: Compilar Sushi the Cat 3DS

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Compilar juego
        run: |
          echo "DEVKITPRO=${DEVKITPRO}"
          echo "DEVKITARM=${DEVKITARM}"
          make clean
          make 3dsx

      - name: Subir instalable compilado
        uses: actions/upload-artifact@v4
        with:
          name: sushi-the-cat-3ds
          path: |
            sushi3ds.3dsx
            sushi3ds.elf
          if-no-files-found: error
